name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run Syntax Lint
      run: php tools/dev/lint_all.php

    - name: Run Static Analysis (PHPStan)
      run: vendor/bin/phpstan analyse -c phpstan.core.neon --memory-limit=1G --no-progress
      continue-on-error: true # Allow it to fail temporarily until we fix all the tech debt

    - name: Run Migrations Verify
      run: php bin/schema_migrate.php verify
      continue-on-error: true # Needs database connection configuration to succeed

    - name: Run Consistency Homologation Tests
      run: php tests/run_consistency_homologation.php
      continue-on-error: true

    - name: Run Shadow Homologation Tests
      run: php tests/run_shadow_homologation.php
      continue-on-error: true

    - name: Run Golden Endpoints Tests
      run: php tests/run_golden_endpoints.php
      continue-on-error: true

    - name: Run Replay Idempotency Tests
      run: php tests/run_replay_idempotency.php
      continue-on-error: true
